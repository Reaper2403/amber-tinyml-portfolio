<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Amber: two models on one ESP32-S3</title><desc id="desc">Motion and audio are processed by separate integer models. Their labels and confidence are joined in a buffered Bluetooth summary. This diagram describes the selected local firmware source.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657b"/></marker></defs><rect x="0" y="0" width="1200" height="780" rx="0" fill="#f6f8fb" stroke="#f6f8fb"/><text x="48" y="48" fill="#b66012" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">AMBER / EMBEDDED ARCHITECTURE</text><text x="48" y="93" fill="#14253c" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Two models. One wearable.</text><text x="48" y="126" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Selected local firmware • int8 inference • separate motion and audio state</text><rect x="318" y="158" width="494" height="438" rx="14" fill="#eaf0f8" stroke="#cbd6e5"/><text x="342" y="190" fill="#365477" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">ESP32-S3 · TENSORFLOW LITE MICRO</text><rect x="48" y="220" width="228" height="144" rx="14" fill="#ffffff" stroke="#d5dce6"/><text x="68" y="252" fill="#b66012" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">WRIST MOTION</text><text x="68" y="288" fill="#14253c" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">QMI8658 IMU</text><text x="68" y="318" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Accelerometer + gyro</text><text x="68" y="344" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">6 channels · 150 samples</text><rect x="48" y="414" width="228" height="150" rx="14" fill="#ffffff" stroke="#d5dce6"/><text x="68" y="446" fill="#b66012" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">ROOM CONTEXT</text><text x="68" y="482" fill="#14253c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Microphone / I²S</text><text x="68" y="512" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">ES8311 audio path</text><text x="68" y="540" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">16 kHz · 2-second clips</text><path d="M276 293 L340 293" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M276 489 L340 489" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="342" y="214" width="446" height="158" rx="14" fill="#ffffff" stroke="#d5dce6"/><text x="364" y="248" fill="#14253c" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Motion inference engine</text><text x="364" y="280" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Unit conversion → window → int8 CNN</text><text x="364" y="311" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">6 activity classes + confidence</text><text x="364" y="344" fill="#365477" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">100,736-byte model · rolling processing</text><rect x="342" y="408" width="446" height="162" rx="14" fill="#ffffff" stroke="#d5dce6"/><text x="364" y="442" fill="#14253c" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Audio inference engine</text><text x="364" y="474" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Log-mel features → int8 DS-CNN</text><text x="364" y="505" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">4 context classes → majority over 5 clips</text><text x="364" y="541" fill="#365477" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">31,656-byte model · 60-second burst cycle</text><path d="M788 293 L865 293" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M788 489 L865 489" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="866" y="240" width="286" height="300" rx="14" fill="#14253c" stroke="#14253c"/><text x="890" y="276" fill="#f5b971" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">COMBINED SUMMARY</text><text x="890" y="314" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Buffered BLE</text><text x="890" y="354" fill="#e5ecf6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Motion label + confidence</text><text x="890" y="385" fill="#e5ecf6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Audio label + confidence</text><text x="890" y="416" fill="#e5ecf6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Vote support + audio age</text><text x="890" y="447" fill="#e5ecf6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Sequence + timestamp</text><text x="890" y="502" fill="#f5b971" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">→ Receiver / phone</text><rect x="48" y="624" width="1104" height="111" rx="14" fill="#ffffff" stroke="#d5dce6"/><text x="70" y="654" fill="#b66012" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">IMPLEMENTATION BOUNDARIES</text><text x="70" y="683" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Separate interpreters and PSRAM arenas. The combined output preserves both modalities.</text><text x="70" y="710" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Sampling rate and energy savings require measurement under combined load; no battery-life claim.</text></svg>