<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 652" role="img" aria-labelledby="title desc"><title id="title">Amber training-to-device pipeline</title><desc id="desc">A five-step flow from PyTorch through Keras and TFLite to embedded inference. Notes show padding, normalization, frontend scaling and runtime operator fixes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657b"/></marker></defs><rect x="0" y="0" width="1200" height="652" rx="0" fill="#f6f8fb" stroke="#f6f8fb"/><text x="48" y="48" fill="#b66012" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">AMBER / CONVERSION CASE STUDY</text><text x="48" y="94" fill="#14253c" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Verify every boundary.</text><text x="48" y="128" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">A strong checkpoint only matters if preprocessing, conversion and runtime preserve its behavior.</text><rect x="48" y="185" width="200" height="182" rx="14" fill="#ffffff" stroke="#d5dce6"/><text x="66" y="216" fill="#b66012" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">01</text><text x="66" y="253" fill="#14253c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">PyTorch</text><text x="66" y="294" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Train + adapt</text><text x="66" y="329" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Reference outputs</text><path d="M249 276 L272 276" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="274" y="185" width="200" height="182" rx="14" fill="#ffffff" stroke="#d5dce6"/><text x="292" y="216" fill="#b66012" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">02</text><text x="292" y="253" fill="#14253c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Keras</text><text x="292" y="294" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Transfer weights</text><text x="292" y="329" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Check numerical parity</text><path d="M475 276 L498 276" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="500" y="185" width="200" height="182" rx="14" fill="#ffffff" stroke="#d5dce6"/><text x="518" y="216" fill="#b66012" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">03</text><text x="518" y="253" fill="#14253c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">TFLite float32</text><text x="518" y="294" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Export graph</text><text x="518" y="329" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Compare logits</text><path d="M701 276 L724 276" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="726" y="185" width="200" height="182" rx="14" fill="#ffffff" stroke="#d5dce6"/><text x="744" y="216" fill="#b66012" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">04</text><text x="744" y="253" fill="#14253c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">TFLite int8</text><text x="744" y="294" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Calibrate + quantize</text><text x="744" y="329" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Measure drift</text><path d="M927 276 L950 276" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="952" y="185" width="200" height="182" rx="14" fill="#ffffff" stroke="#d5dce6"/><text x="970" y="216" fill="#b66012" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">05</text><text x="970" y="253" fill="#14253c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">ESP32-S3</text><text x="970" y="294" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">TFLM + frontend</text><text x="970" y="329" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Measure on device</text><rect x="48" y="408" width="538" height="178" rx="14" fill="#fff4e7" stroke="#eddbc5"/><text x="72" y="442" fill="#9b5415" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">CONVERSION FIX</text><text x="72" y="480" fill="#14253c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Explicit symmetric padding</text><text x="72" y="514" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">ZeroPadding2D + valid convolution</text><text x="72" y="548" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">BatchNorm epsilon matched to PyTorch: 1e-5</text><rect x="610" y="408" width="542" height="178" rx="14" fill="#ffffff" stroke="#d5dce6"/><text x="634" y="442" fill="#365477" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">RUNTIME FIX</text><text x="634" y="480" fill="#14253c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Match the frontend and graph</text><text x="634" y="514" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Scale int16 PCM by 1 / 32768</text><text x="634" y="548" fill="#25354b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Register PAD in the TFLM operator resolver</text><text x="48" y="623" fill="#52657b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Historical engineering case study; new host smoke checks do not reproduce original dataset metrics.</text></svg>